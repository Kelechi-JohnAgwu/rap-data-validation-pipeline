name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::purrr
            any::readr
            any::readxl
            any::targets
            any::tarchetypes
            any::tibble
            any::rprojroot

      - name: Run tests
        run: Rscript -e "testthat::test_dir('tests/testthat')"
